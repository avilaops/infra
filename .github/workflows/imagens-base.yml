name: Espelhar imagens base no GHCR

# Cópia das imagens base do Docker Hub em ghcr.io/avilaops/base/<imagem>.
#
# Os builds das aplicações baixavam a base direto do Docker Hub, sem login, e
# o limite anônimo dele é por IP; os runners do GitHub dividem IP com o mundo
# todo. Em 09/10/2026 o build do lojas.avilaops.com caiu três vezes seguidas
# em `429 Too Many Requests` antes de compilar uma linha.
#
# Aqui o login no Docker Hub acontece uma vez, com os secrets DESTE repositório
# (DOCKERHUB_USERNAME e DOCKERHUB_TOKEN, só leitura), e as aplicações passam a
# usar `FROM ghcr.io/avilaops/base/<imagem>`, sem secret nenhum.
#
# `imagetools create` copia o índice multi-arquitetura inteiro, com o mesmo
# digest da origem: é a mesma imagem oficial, não um rebuild.
#
# Imagem nova: acrescente na matriz. Depois do primeiro espelhamento, deixe o
# pacote público (ver IMAGENS-BASE.md).

on:
  schedule:
    # Todo dia, 05:17 UTC (02:17 em São Paulo): pega as correções de segurança
    # que as imagens oficiais recebem sem mudar de tag.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/imagens-base.yml
  pull_request:
    paths:
      - .github/workflows/imagens-base.yml

permissions:
  contents: read

concurrency:
  group: imagens-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  espelhar:
    name: espelhar / ${{ matrix.imagem }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Bases do Docker Hub em uso nos repositórios avilaops públicos
        # (levantamento de 09/10/2026). Os privados entram quando migrarem.
        imagem:
          - debian:bookworm-slim
          - nginx:1.31-alpine
          - node:20-bookworm
          - node:20-bookworm-slim
          - node:22-alpine
          - node:22-bookworm
          - node:22-bookworm-slim
          - node:24-alpine
          - node:24-bookworm-slim
          - python:3.12-slim
          - rust:1-bookworm
    env:
      # Pull request só confere que a cópia é possível; quem publica é a main.
      PUBLICAR: ${{ github.event_name != 'pull_request' }}
      IMAGEM: ${{ matrix.imagem }}
    steps:
      - name: Validar nome da imagem
        run: |
          set -euo pipefail
          # Só imagens oficiais (docker.io/library), nome:tag sem barra.
          [[ "$IMAGEM" =~ ^[a-z0-9][a-z0-9._-]*:[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      - name: Preparar Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Autenticar no Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Autenticar no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copiar para o GHCR
        run: |
          set -euo pipefail
          origem="docker.io/library/${IMAGEM}"
          destino="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/base/${IMAGEM}"
          if [[ "$PUBLICAR" != true ]]; then
            docker buildx imagetools create --dry-run --tag "$destino" "$origem" > /dev/null
            echo "ok (dry-run): $origem -> $destino"
            exit 0
          fi
          # Fixa o digest antes de copiar: se a tag mudar no meio, a cópia e a
          # conferência continuam falando da mesma imagem.
          digest_origem="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$origem" | tr -d '"')"
          docker buildx imagetools create --tag "$destino" "${origem}@${digest_origem}"
          # A cópia tem de ser a mesma imagem: mesmo digest de índice.
          digest_destino="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$destino" | tr -d '"')"
          if [[ "$digest_origem" != "$digest_destino" ]]; then
            echo "::error::digest diferente: $origem $digest_origem, $destino $digest_destino"
            exit 1
          fi
          echo "$origem -> $destino ($digest_destino)"
