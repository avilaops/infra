name: Conferir scripts de deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash -n scripts/deploy-container.sh scripts/deploy-static.sh scripts/deploy-systemd.sh
      - run: python3 -m unittest discover -s tests -v
